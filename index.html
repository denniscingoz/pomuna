<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomuna | Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(177, 196, 163, 0.18), transparent 32%),
        radial-gradient(circle at 80% 70%, rgba(104, 129, 111, 0.16), transparent 35%),
        #f4f1e9;
      color: #1f3028;
      font-family: Arial, Helvetica, sans-serif;
    }

    .grid {
      position: fixed;
      inset: 0;
      opacity: 0.4;
      background-image:
        linear-gradient(rgba(31, 48, 40, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 48, 40, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle, black 20%, transparent 75%);
    }

    .shape {
      position: fixed;
      border: 1px solid rgba(31, 48, 40, 0.12);
      border-radius: 50%;
      animation: float 14s ease-in-out infinite;
    }

    .shape-one {
      width: 340px;
      height: 340px;
      top: -120px;
      right: -80px;
    }

    .shape-two {
      width: 500px;
      height: 500px;
      bottom: -250px;
      left: -170px;
      animation-delay: -5s;
    }

    .container {
      position: relative;
      width: min(90%, 880px);
      padding: 72px 48px;
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      border: 1px solid rgba(31, 48, 40, 0.25);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -3px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: #607465;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #79917d;
      box-shadow: 0 0 0 6px rgba(121, 145, 125, 0.14);
      animation: pulse 2s infinite;
    }

    h1 {
      max-width: 760px;
      margin: 0 auto;
      color: #24382e;
      font-size: clamp(52px, 9vw, 104px);
      line-height: 0.95;
      letter-spacing: -7px;
    }

    p {
      max-width: 560px;
      margin: 28px auto 0;
      color: #66756d;
      font-size: 18px;
      line-height: 1.7;
    }

    .line {
      width: 80px;
      height: 1px;
      margin: 38px auto 24px;
      background: rgba(31, 48, 40, 0.35);
    }

    .footer {
      color: #839087;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.55;
        transform: scale(0.8);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(28px) rotate(8deg);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 48px 20px;
      }

      h1 {
        letter-spacing: -4px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="grid"></div>
  <div class="shape shape-one"></div>
  <div class="shape shape-two"></div>

  <main class="container">
    <div class="logo">P</div>

    <div class="status">
      <span class="dot"></span>
      Website under construction
    </div>

    <h1>Pomuna is taking shape.</h1>

    <p>
      We are currently building our website.
      A new digital experience will be available soon.
    </p>

    <div class="line"></div>

    <div class="footer">
      Pomuna · Coming Soon
    </div>
  </main>
</body>
</html>
